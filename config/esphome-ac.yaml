# ESPHome config: Daikin AC IR control + room temperature/humidity sensor.
#
# Flash: esphome run config/esphome-ac.yaml
# API:   http://192.168.88.50/climate/ac (GET state, POST set)
#        http://192.168.88.50/sensor/room_temperature (GET)
#        http://192.168.88.50/sensor/room_humidity (GET)
#
# Pushes readings to RPi every 30s via HTTP POST.
#
# Hardware wiring:
#   GPIO4  → 100Ω → 2N2222 base (collector → IR LED → 3.3V, emitter → GND)
#   GPIO16 → DHT22 data pin (with 10kΩ pull-up to 3.3V)
#   3.3V   → DHT22 VCC + IR LED anode
#   GND    → DHT22 GND + 2N2222 emitter

esphome:
  name: ac-ir
  friendly_name: "AC IR Controller"

esp32:
  board: esp32dev

wifi:
  ssid: "HX510_A407"
  password: !secret wifi_password    # create secrets.yaml with: wifi_password: "your-pass"
  manual_ip:
    static_ip: 192.168.88.50
    gateway: 192.168.88.1
    subnet: 255.255.255.0
  ap:
    ssid: "ac-ir-fallback"
    password: "fallback123"

# Local web server — serves REST API for Node.js integration
web_server:
  port: 80

# Enable logging
logger:
  level: INFO

# OTA updates (no USB needed after first flash)
ota:
  platform: esphome
  password: "eurisco"

# ── IR Transmitter ──────────────────────────────────────────────────────────

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

climate:
  - platform: daikin
    name: "ac"
    receiver_id: []              # TX only, no IR receiver

# ── Temperature + Humidity Sensor ───────────────────────────────────────────
# Using DHT22 (AM2302). For DHT11, change model to DHT11.
# For BME280/SHT30 (I2C), replace this block with the i2c + sensor config.

sensor:
  - platform: dht
    model: DHT22                 # change to DHT11 if using DHT11
    pin: GPIO16
    temperature:
      name: "Room Temperature"
      id: room_temp
      accuracy_decimals: 1
    humidity:
      name: "Room Humidity"
      id: room_humidity
      accuracy_decimals: 0
    update_interval: 30s

# ── Push readings to RPi ───────────────────────────────────────────────────

http_request:
  useragent: "esphome/ac-ir"
  timeout: 5s

interval:
  - interval: 30s
    then:
      - http_request.post:
          url: "http://192.168.88.9:3141/temperature"
          headers:
            Content-Type: "application/json"
          json: |-
            root["temp"] = id(room_temp).state;
            root["humidity"] = id(room_humidity).state;
          on_response:
            then:
              - logger.log:
                  format: "POST /temperature → %d"
                  args: ["response_code"]
